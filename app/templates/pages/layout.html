<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gitogether{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 2rem; }
        input { width: 100%; padding: 0.5rem; margin: 0.5rem 0; box-sizing: border-box; }
        button { padding: 0.5rem 1rem; background: #0066cc; color: white; border: none; cursor: pointer; }
        button:hover { background: #0052a3; }
        .error { color: #dc3545; margin: 0.5rem 0; }
        .success { color: #28a745; margin: 0.5rem 0; }
        nav { margin-bottom: 2rem; }
        nav a { margin-right: 1rem; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Home</a>
        {% if session %}
            <button hx-get="/signout">Sign Out</button>
        {% else %}
            <a href="/signin">Sign In</a>
            <a href="/signup">Sign Up</a>
        {% endif %}
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
