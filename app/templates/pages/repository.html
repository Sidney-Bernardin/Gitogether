{% extends "pages/layout.html" %}

{% block title %}{{ repo_info.name }}{% endblock %}

{% block content %}
{% if tree %}
    <ul>
        {% for obj in tree %}
            <a href="{{ url_for('repository', username=username, repo_name=repo_name, commit=commit, path=(path or "") + obj.name) }}">{{ obj.name }}</a>
        {% endfor %}
    </ul>
{% elif blob %}
    {{ blob }}
{% elif not_found %}
    Not Found
{% elif not commit %}
no commits
{% endif %}
{% endblock %}
