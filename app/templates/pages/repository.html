{% extends "pages/layout.html" %}

{% block title %}{{ repo.name }}{% endblock %}

{% block content %}
{% if tree %}
    <ul>
        {% for file in tree %}
            <a href="{{ url_for('repository', username=username, repo_name=repo.name, commit=commit, path=(f"{path}/" if path else "") + file.name) }}">
                {{ file.name }}
            </a>
        {% endfor %}
    </ul>
{% elif blob %}
    {{ blob }}
{% elif not_found %}
    Not Found
{% elif not commit %}
    no commits
{% endif %}
{% endblock %}
