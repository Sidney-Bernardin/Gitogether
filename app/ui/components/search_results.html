<div hx-swap-oob="innerHTML:.results">
    {% for search_result in search_results %}
        <li tabindex="{{ loop.index0 }}">
            <a href="{{ url_for("user_page", username=search_result.username)}}">
                {{ search_result.username }}
            </a>
            /
            <a href="{{ url_for("repository_code_page", username=search_result.username, reponame=search_result.reponame) }}">
                {{ search_result.reponame }}
            </a>
        </li>
    {% endfor %}
</div>
