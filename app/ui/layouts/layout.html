<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Gitogether{% endblock %}</title>

        <script src="{{ url_for("static", path="main.js") }}" defer></script>

        <link rel="stylesheet" href="{{ url_for("static", path="main.css") }}">
        <link rel="stylesheet" href="{{ url_for("static", path="layouts/layout.css") }}">
        <link rel="stylesheet" href="{{ url_for("static", path="components/navbar.css") }}">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css" />
        <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css" />
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html-ui.min.js"></script>
        <script src="https://kit.fontawesome.com/57e5da63fa.js" crossorigin="anonymous"></script>

        {% block head %}{% endblock %}
    </head>
    <body>
        {% include "components/navbar.html" %}
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </body>
</html>
